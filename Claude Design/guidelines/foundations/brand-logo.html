<!-- @dsCard group="Brand" viewport="700x190" name="Logo — GOAI mark & lockup" subtitle="Full-colour on white or navy; never on busy imagery" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .plate { display: flex; align-items: center; justify-content: center; gap: 28px; height: 150px; border-radius: var(--radius-card); border: 1px solid var(--color-border); }
  .plate.navy { background: var(--color-primary); border-color: transparent; }
  .plate img.mark { height: 44px; }
  .plate img.full { height: 78px; }
</style>
</head>
<body>
  <div class="plate"><img class="mark" src="../../assets/goai-mark.png" alt="GOAI mark" /><img class="full" src="../../assets/goai-logo.png" alt="JC GoAI lockup" /></div>
  <div class="plate navy"><img class="mark" src="../../assets/goai-mark-white.png" alt="GOAI mark reversed" /><img class="full" src="../../assets/goai-logo-white.png" alt="JC GoAI lockup reversed" /></div>
</body>
</html>
