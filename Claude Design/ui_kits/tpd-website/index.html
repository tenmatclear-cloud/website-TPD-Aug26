<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JC GoAI · TPD Workshop</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); }
  .tpd-app { min-height: 100vh; }

  /* ---- Header ---- */
  .tpd-header { position: sticky; top: 0; z-index: 100; min-height: var(--header-height);
    border-bottom: 1px solid var(--color-border); background: rgb(255 255 255 / 0.96); backdrop-filter: blur(18px); }
  .tpd-header-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px;
    width: min(var(--max-width), calc(100% - var(--gutter) * 2)); min-height: var(--header-height); margin: 0 auto; }
  .tpd-brand { display: flex; align-items: center; gap: 12px; }
  .tpd-brand-text { display: grid; line-height: 1.05; }
  .tpd-brand-text strong { font: 800 1.05rem/1 var(--font-heading); color: var(--color-primary); }
  .tpd-brand-text em { font: 600 0.7rem/1.3 var(--font-body); font-style: normal; color: var(--text-muted); }
  .tpd-nav { display: flex; align-items: center; gap: 20px; font-size: 0.95rem; }
  .tpd-nav a { padding: 6px 0; color: var(--color-text-primary); transition: color var(--duration-fast) var(--ease-standard); cursor: pointer; }
  .tpd-nav a:hover, .tpd-nav a.is-current { color: var(--color-primary); font-weight: 700; }
  .tpd-header-actions { display: flex; align-items: center; gap: 14px; }
  .tpd-lang { display: flex; gap: 6px; }
  .tpd-lang button { min-width: 40px; padding: 7px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-button);
    background: transparent; font: 700 0.82rem/1 var(--font-heading); color: var(--text-body); cursor: pointer; }
  .tpd-lang button.on { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-accent-gold); }

  /* ---- Hero ---- */
  .tpd-hero { overflow: hidden; border-radius: 0 0 var(--radius-hero) var(--radius-hero); background: var(--gradient-hero); color: var(--color-white); }
  .tpd-hero-inner { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr); gap: clamp(32px, 6vw, 80px);
    width: min(var(--max-width), calc(100% - var(--gutter) * 2)); margin: 0 auto; padding: clamp(56px, 9vw, 104px) 0 clamp(72px, 11vw, 124px); }
  .tpd-hero-title { margin-top: 18px; color: #fff; max-width: 760px; }
  .tpd-hero-lead { max-width: 720px; margin-top: 20px; color: var(--text-on-dark-muted); font-size: var(--text-lead); }
  .tpd-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .tpd-hero-panel { align-self: end; padding: 28px; border: 1px solid var(--border-on-dark); border-radius: 34px; background: rgb(255 255 255 / 0.12); }
  .tpd-hero-panel dl { display: grid; gap: 18px; margin: 0; }
  .tpd-hero-panel dt { color: var(--color-accent-gold); font: 800 0.78rem/1 var(--font-heading); letter-spacing: .08em; text-transform: uppercase; }
  .tpd-hero-panel dd { margin: 4px 0 0; font-size: 1.05rem; font-weight: 700; }
  .tpd-hero-panel dd.muted { font-size: 0.92rem; font-weight: 500; color: var(--text-on-dark-muted); }

  /* ---- Content shell + sections ---- */
  .tpd-shell { position: relative; z-index: 10; width: min(var(--max-width), calc(100% - var(--gutter) * 2)); margin: -48px auto 0; padding-bottom: 80px; }
  .tpd-shell-top { margin-top: 40px; }
  .tpd-section { padding: var(--space-section-y); border-radius: var(--radius-content); background: var(--surface-card); box-shadow: var(--shadow-soft); }
  .tpd-section + .tpd-section, .tpd-section + .tpd-split, .tpd-split + .tpd-section { margin-top: var(--space-section-gap); }
  .tpd-section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
  .tpd-section-head h2 { margin-top: 10px; }
  .tpd-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .tpd-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .tpd-stack { display: grid; gap: 14px; }

  /* ---- Split impact section ---- */
  .tpd-split { display: grid; grid-template-columns: 0.9fr 1.1fr; overflow: hidden; border-radius: var(--radius-content); color: var(--color-white);
    background: linear-gradient(to right, var(--color-accent-yellow) 0 42%, var(--color-primary) 42% 100%); }
  .tpd-split > div { padding: clamp(36px, 6vw, 60px); }
  .tpd-split-yellow h2 { color: var(--color-primary); margin-top: 12px; }
  .tpd-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px 20px; }

  /* ---- Footer ---- */
  .tpd-footer { margin-top: 70px; background: var(--surface-card); }
  .tpd-footer-inner { width: min(var(--max-width), calc(100% - var(--gutter) * 2)); margin: 0 auto; padding: 44px 0; }
  .tpd-footer-note { max-width: 760px; margin: 16px 0 0; color: var(--text-muted); }
  .tpd-footer-meta { margin: 10px 0 0; color: var(--text-muted); font-size: 0.9rem; }
  .tpd-footer-bar { height: 16px; background: var(--gradient-footer-bar); }

  @media (max-width: 980px) {
    .tpd-header-inner { flex-wrap: wrap; gap: 12px; padding: 12px 0; }
    .tpd-hero-inner, .tpd-split { grid-template-columns: 1fr; }
    .tpd-grid-3, .tpd-grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
