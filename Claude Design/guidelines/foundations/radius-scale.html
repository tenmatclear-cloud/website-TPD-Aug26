<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Soft, generous geometry — pills for actions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .item { display: grid; gap: 8px; justify-items: center; }
  .box { width: 96px; height: 72px; background: var(--color-bg-light); border: 1.5px solid var(--color-soft-blue-1); }
  .tok { font: 700 0.74rem/1 var(--font-heading); color: var(--text-strong); }
  .val { font: 500 0.7rem/1 var(--font-body); color: var(--text-muted); }
  .pill { width: 110px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--color-primary); color: #fff; border-radius: 999px; font: 800 0.78rem/1 var(--font-heading); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:18px"></div><span class="tok">sm</span><span class="val">18px</span></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><span class="tok">md</span><span class="val">24px</span></div>
  <div class="item"><div class="box" style="border-radius:28px"></div><span class="tok">card</span><span class="val">28px</span></div>
  <div class="item"><div class="box" style="border-radius:32px"></div><span class="tok">content</span><span class="val">32px</span></div>
  <div class="item"><div class="box" style="border-radius:40px 40px 0 0"></div><span class="tok">hero</span><span class="val">40px ↓</span></div>
  <div class="item"><div class="pill">Pill</div><span class="tok">button</span><span class="val">999px</span></div>
</div>
</body>
</html>
