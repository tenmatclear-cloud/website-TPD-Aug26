<!-- @dsCard group="Type" viewport="700x300" name="Display — Montserrat" subtitle="Headings (substitute for Galano Grotesque)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--color-border); }
  .row:last-child { border-bottom: 0; }
  .spec { flex: 0 0 130px; font: 600 0.72rem/1.4 var(--font-body); color: var(--text-muted); }
  .sample { font-family: var(--font-heading); color: var(--text-strong); line-height: 1.1; }
</style>
</head>
<body>
  <div class="row"><span class="spec">Hero · 800<br/>clamp → 4.9rem</span><span class="sample" style="font-size:3.2rem;font-weight:800">Teaching with AI</span></div>
  <div class="row"><span class="spec">Section H2 · 800<br/>clamp → 3rem</span><span class="sample" style="font-size:2.1rem;font-weight:800">Schedule at a glance</span></div>
  <div class="row"><span class="spec">Sub H3 · 700<br/>clamp → 1.65rem</span><span class="sample" style="font-size:1.5rem;font-weight:700">Learning objectives</span></div>
  <div class="row"><span class="spec">Stat · 900</span><span class="sample" style="font-size:2.5rem;font-weight:900">255M</span></div>
</body>
</html>
