<style>
  body { margin: 0; padding: 26px 28px; background: var(--surface-page); }

  .block { margin-bottom: 30px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

<body>
<div id="root"></div>
