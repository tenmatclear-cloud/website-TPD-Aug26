<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Text, borders and surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-card); font-family: var(--font-body); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { display: grid; gap: 8px; }
  .chip { height: 64px; border-radius: 14px; border: 1px solid var(--color-border); }
  .name { font: 700 0.78rem/1.2 var(--font-heading); color: var(--text-strong); }
  .hex { font: 500 0.72rem/1.2 var(--font-body); color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
<div class="swatches">
  <div class="sw"><div class="chip" style="background:var(--color-text-primary)"></div><span class="name">Text</span><span class="hex">#0D121D</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-text-secondary)"></div><span class="name">Muted</span><span class="hex">#5E646D</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-border)"></div><span class="name">Border</span><span class="hex">#E8E8E8</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-bg-gray)"></div><span class="name">BG Gray</span><span class="hex">#F5F5F5</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-page)"></div><span class="name">Page</span><span class="hex">#F7F9FF</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-white)"></div><span class="name">White</span><span class="hex">#FFFFFF</span></div>
</div>
</body>
</html>
