<!-- @dsCard group="Type" viewport="700x150" name="Labels & eyebrows" subtitle="Uppercase kickers and pill labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
  .eyebrow { font: 800 0.85rem/1 var(--font-heading); letter-spacing: .06em; text-transform: uppercase; color: var(--color-primary); }
  .eyebrow.gold { color: var(--color-accent-gold); background: var(--color-primary); padding: 6px 12px; border-radius: 999px; }
  .tag { font: 800 0.78rem/1 var(--font-heading); letter-spacing: .02em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; }
</style>
</head>
<body>
  <span class="eyebrow">Learning Objectives</span>
  <span class="eyebrow gold">JC GoAI Project</span>
  <span class="tag" style="background:var(--color-accent-orange);color:#fff">Event</span>
  <span class="tag" style="background:var(--color-accent-yellow);color:var(--color-primary)">News</span>
  <span class="tag" style="background:var(--color-bg-light);color:var(--color-primary)">Primary</span>
</body>
</html>
