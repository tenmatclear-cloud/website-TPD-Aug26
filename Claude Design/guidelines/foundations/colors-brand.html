<!-- @dsCard group="Colors" viewport="700x150" name="Brand navy & blues" subtitle="Deep navy authority with supporting blues" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-card); font-family: var(--font-body); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { display: grid; gap: 8px; }
  .chip { height: 64px; border-radius: 14px; border: 1px solid var(--color-border); }
  .name { font: 700 0.78rem/1.2 var(--font-heading); color: var(--text-strong); }
  .hex { font: 500 0.72rem/1.2 var(--font-body); color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
<div class="swatches">
  <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><span class="name">Primary</span><span class="hex">#022169</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-hero-bg)"></div><span class="name">Hero BG</span><span class="hex">#04246F</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-accent-blue)"></div><span class="name">Accent Blue</span><span class="hex">#0473EA</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-soft-blue-1)"></div><span class="name">Soft Blue 1</span><span class="hex">#D0E0FF</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-bg-light)"></div><span class="name">Light Blue</span><span class="hex">#E8F0FF</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-soft-blue-2)"></div><span class="name">Soft Blue 2</span><span class="hex">#F0F4FF</span></div>
</div>
</body>
</html>
