<!-- @dsCard group="Brand" viewport="700x180" name="Accent role map" subtitle="Colour is semantic — assign consistently" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-card); display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; font-family: var(--font-body); }
  .card { position: relative; overflow: hidden; padding: 18px 18px 18px 24px; border: 1px solid var(--color-border); border-radius: var(--radius-card); }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 7px; }
  .c1::before { background: var(--color-accent-orange); }
  .c2::before { background: var(--color-accent-green); }
  .c3::before { background: var(--color-accent-yellow); }
  h4 { margin: 0 0 4px; font: 700 1rem/1.2 var(--font-heading); color: var(--text-strong); }
  p { margin: 0; font-size: 0.82rem; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card c1"><h4>Programme</h4><p>Orange — programme, events, agenda</p></div>
  <div class="card c2"><h4>Teachers</h4><p>Green — co-creation, objectives</p></div>
  <div class="card c3"><h4>Schools</h4><p>Yellow — schools, news, impact stats</p></div>
</body>
</html>
